name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate sound assets
        run: python3 tools/generate_sounds.py

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Unit tests
        run: gradle test --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spin-poker-10-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create debug --prerelease --title "APK debug"             --notes "APK debug de Spin Poker 10, reconstruit à chaque push."             app/build/outputs/apk/debug/app-debug.apk             || gh release upload debug app/build/outputs/apk/debug/app-debug.apk --clobber
